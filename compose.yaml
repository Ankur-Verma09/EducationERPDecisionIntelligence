services:
  api:
    build:
      context: .
    environment:
      EDUERP_ENVIRONMENT: local
      EDUERP_DATABASE_URL: postgresql+psycopg://education_erp:local-only@database:5432/education_erp
      EDUERP_ALLOWED_HOSTS: localhost,127.0.0.1,api
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      EDUERP_ENVIRONMENT: local
      EDUERP_DATABASE_URL: postgresql+psycopg://education_erp:local-only@database:5432/education_erp
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: education_erp
      POSTGRES_USER: education_erp
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education_erp -d education_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
