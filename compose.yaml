services:
  api:
    profiles: ["core"]
    build:
      context: .
    environment:
      EDUERP_ENVIRONMENT: local
      EDUERP_DATABASE_URL: postgresql+psycopg://education_erp_app:local-runtime-only@database:5432/education_erp
      EDUERP_ALLOWED_HOSTS: localhost,127.0.0.1,api
    ports:
      - "8000:8000"
    networks:
      - core_edge
      - core_data
      - core_ai_boundary
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    profiles: ["core"]
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      EDUERP_ENVIRONMENT: local
      EDUERP_DATABASE_URL: postgresql+psycopg://education_erp:local-only@database:5432/education_erp
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - core_data
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.75

  database:
    profiles: ["core"]
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: education_erp
      POSTGRES_USER: education_erp
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - core_data
      - database_admin
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education_erp -d education_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-contract-test-double:
    profiles: ["ai"]
    build:
      context: .
    command:
      [
        "uvicorn",
        "education_erp.ai_test_double:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    environment:
      AI_EXTERNAL_PROVIDER_ACCESS: "disabled"
      AI_INFERENCE_ENABLED: "false"
    expose:
      - "8080"
    networks:
      - core_ai_boundary
      - ai_internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

networks:
  core_edge:
  database_admin:
  core_data:
    internal: true
  core_ai_boundary:
    internal: true
  ai_internal:
    internal: true
