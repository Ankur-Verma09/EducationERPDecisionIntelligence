name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: education_erp_test
          POSTGRES_USER: education_erp
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U education_erp -d education_erp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      EDUERP_ENVIRONMENT: test
      EDUERP_DATABASE_URL: postgresql+psycopg://education_erp:ci-only@localhost:5432/education_erp_test
      EDUERP_TEST_DATABASE_URL: postgresql+psycopg://education_erp:ci-only@localhost:5432/education_erp_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - run: python -m pip check
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest
      - run: bandit -c pyproject.toml -r src
      - run: pip-audit
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2
          dir /repo --no-banner --redact
      - run: docker build --tag education-erp:${{ github.sha }} .
      - name: Container vulnerability scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.58.2 image --exit-code 1 --severity CRITICAL
          education-erp:${{ github.sha }}
      - name: Container smoke test
        run: |
          docker run --detach --name education-erp-api --network host \
            -e EDUERP_ENVIRONMENT=test \
            -e EDUERP_DATABASE_URL="$EDUERP_DATABASE_URL" \
            -e EDUERP_ALLOWED_HOSTS=localhost,127.0.0.1 \
            education-erp:${{ github.sha }}
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs education-erp-api
          exit 1
      - if: always()
        run: docker rm --force education-erp-api || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-1-sbom
          path: sbom.json
          retention-days: 30
